{% extends "base.html" %}
{% block title %}Edit Workout — HomeFit{% endblock %}

{% block content %}
<section style="max-width:560px; margin:0 auto;">
  <h1>Edit workout</h1>
  <p class="subtle" style="font-size:13px;">{{ workout.day_name }} · {{ workout.completed_at[:10] }} — fix any weights or reps you missed.</p>

  <div id="ex-list"></div>

  <div style="display:flex; gap:8px; margin-top:16px;">
    <button id="save-btn" class="btn btn-primary" style="flex:1;">Save changes</button>
    <a href="{{ url_for('progress') }}" class="btn btn-secondary">Cancel</a>
  </div>
  <p id="save-status" class="subtle" style="font-size:12px; margin-top:8px;"></p>
</section>

<script id="wo-data" type="application/json">{{ workout|tojson }}</script>
{% endblock %}

{% block scripts %}
<script>
(function () {
  const wo = JSON.parse(document.getElementById('wo-data').textContent);
  const listEl = document.getElementById('ex-list');

  function setRow(s) {
    const w = (s && s.weight != null && s.weight !== 0) ? s.weight : (s && s.weight === 0 ? 0 : '');
    const r = (s && s.reps != null && s.reps !== 0) ? s.reps : (s && s.reps === 0 ? 0 : '');
    const div = document.createElement('div');
    div.className = 'set-row';
    div.style.cssText = 'display:flex; gap:6px; align-items:center; margin:5px 0;';
    div.innerHTML = `<input class="s-weight" type="number" inputmode="decimal" placeholder="wt" value="${w === '' ? '' : w}" style="width:80px;">
      <span class="subtle">lbs ×</span>
      <input class="s-reps" type="number" inputmode="numeric" placeholder="reps" value="${r === '' ? '' : r}" style="width:70px;">
      <span class="subtle">reps</span>
      <button class="rm-set pill" title="remove set" style="cursor:pointer; border:none; margin-left:auto; font-size:12px;">✕</button>`;
    div.querySelector('.rm-set').addEventListener('click', () => div.remove());
    return div;
  }

  (wo.exercises || []).forEach((ex, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.cssText = 'padding:12px 14px; margin-bottom:10px;';
    card.dataset.idx = i;
    card.innerHTML = `<strong>${ex.name || ex.id || 'Exercise'}</strong>`;
    const sets = document.createElement('div'); sets.className = 'sets';
    (ex.sets && ex.sets.length ? ex.sets : [{}]).forEach((s) => sets.appendChild(setRow(s)));
    card.appendChild(sets);
    const add = document.createElement('button');
    add.className = 'pill'; add.textContent = '+ add set';
    add.style.cssText = 'cursor:pointer; border:none; font-size:12px; margin-top:4px;';
    add.addEventListener('click', () => sets.appendChild(setRow({})));
    card.appendChild(add);
    listEl.appendChild(card);
  });

  document.getElementById('save-btn').addEventListener('click', async () => {
    const cards = listEl.querySelectorAll('.card');
    const exercises = (wo.exercises || []).map((ex, i) => {
      const sets = Array.from(cards[i].querySelectorAll('.set-row')).map((row) => {
        const wv = row.querySelector('.s-weight').value;
        const rv = row.querySelector('.s-reps').value;
        return { weight: wv === '' ? 0 : parseFloat(wv), reps: rv === '' ? 0 : parseInt(rv, 10) };
      }).filter((s) => s.weight || s.reps);   // drop fully-empty rows
      return Object.assign({}, ex, { sets, completed: sets.length > 0 });
    });
    const btn = document.getElementById('save-btn'); btn.disabled = true;
    const st = document.getElementById('save-status'); st.textContent = 'Saving…';
    try {
      const r = await fetch('/api/workout/update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: wo.id, exercises }) });
      const d = await r.json();
      if (d.ok) { st.textContent = '✓ Saved — redirecting…'; setTimeout(() => location.href = '{{ url_for("progress") }}', 700); }
      else { st.textContent = 'Save failed.'; btn.disabled = false; }
    } catch (e) { st.textContent = 'Save failed (' + e.message + ').'; btn.disabled = false; }
  });
})();
</script>
{% endblock %}
