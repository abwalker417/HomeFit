{% extends "base.html" %}
{% block title %}Building workout — HomeFit{% endblock %}

{% block content %}
<section style="text-align:center; padding:60px 20px;">
  <img src="{{ url_for('static', filename='icons/apex.png') }}" style="width:80px; height:80px; border-radius:20px; margin-bottom:20px;">
  <h1 style="margin-bottom:8px;">Apex is building your workout</h1>
  <p class="subtle" style="margin-bottom:32px;">Reviewing your history and planning {{ focus }}…</p>
  <div style="display:inline-block; width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite;"></div>

  <div class="slogan slogan--loading">
    <p>No Mirror. No Membership.</p>
    <p>No Days Off.</p>
  </div>
</section>
<style>
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
{% endblock %}

{% block scripts %}
<script>
  // Poll until the workout is ready in session, then redirect
  async function checkReady() {
    const resp = await fetch('/api/workout-ready');
    const data = await resp.json();
    if (data.ready) {
      window.location.href = '/today-workout';
    } else {
      setTimeout(checkReady, 1500);
    }
  }
  checkReady();
</script>
{% endblock %}
