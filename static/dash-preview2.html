<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HomeFit — dashboard v2</title>
<style>
  :root{ --bg:#050506; --surface:#0f0f11; --surface-2:#161618; --border:#26262a;
    --text:#f4f4f5; --subtle:#8a8a90; --accent:#22d3ee; --accent-rgb:34,211,238; --radius:14px; }
  *{ box-sizing:border-box; } html,body{ margin:0; width:390px; overflow-x:hidden; }
  body{ background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  .device{ width:390px; min-height:844px; margin:0 auto; position:relative; overflow:hidden; background:var(--bg); }
  /* the garage scene as the real background */
  .scene{ position:absolute; inset:0; z-index:0; pointer-events:none;
    background:url('icons/redesign/scene/ice.png') center center / cover no-repeat; opacity:1; }
  .scene-dim{ position:absolute; inset:0; z-index:0; pointer-events:none;
    background: radial-gradient(110% 26% at 50% -2%, rgba(var(--accent-rgb),0.12) 0%, rgba(0,0,0,0) 55%),
                linear-gradient(180deg, rgba(5,5,6,0.58) 0%, rgba(5,5,6,0.22) 12%, rgba(5,5,6,0.06) 34%, rgba(5,5,6,0.06) 66%, rgba(5,5,6,0.22) 100%); }
  .floor{ display:none; }
  .screen{ position:relative; z-index:1; padding:16px 0 60px; }
  .pad{ padding:0 18px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; }
  .lockup{ display:flex; align-items:center; gap:10px; }
  .mark{ width:36px; height:36px; border-radius:9px; overflow:hidden; border:1px solid var(--border); }
  .mark img{ width:100%; height:100%; object-fit:cover; display:block; }
  .wordmark{ font-size:11px; letter-spacing:0.34em; text-transform:uppercase; color:var(--subtle); font-weight:700; }
  .me{ width:34px; height:34px; border-radius:50%; background:rgba(var(--accent-rgb),0.16); color:var(--accent); display:grid; place-items:center; font-weight:700; font-size:15px; }

  .greet{ margin:24px 0 4px; }
  .greet .eyebrow{ font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--subtle); margin:0 0 6px; }
  .greet h1{ font-size:25px; margin:0; letter-spacing:-0.01em; }

  .today{ margin:16px 0 0; background:rgba(48,50,56,0.38); -webkit-backdrop-filter:blur(18px) saturate(1.1); backdrop-filter:blur(18px) saturate(1.1); border:1px solid rgba(255,255,255,0.13); border-left:3px solid var(--accent); border-radius:var(--radius); padding:16px 16px 18px; }
  .today .tag{ font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); font-weight:700; margin:0 0 6px; }
  .today h2{ margin:0; font-size:19px; } .today .meta{ color:var(--subtle); font-size:13px; margin:4px 0 14px; }
  .btn{ display:block; width:100%; text-align:center; background:var(--accent); color:#04161a; font-weight:700; font-size:15px; border:none; border-radius:11px; padding:13px; }

  .row-label{ font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--subtle); margin:26px 0 12px; }
  /* swipeable strip — bigger tiles */
  .strip{ display:flex; gap:12px; overflow-x:auto; padding:2px 18px 6px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
  .strip::-webkit-scrollbar{ display:none; }
  .cat{ flex:0 0 auto; width:104px; scroll-snap-align:start; text-align:center; }
  .cat .art{ width:104px; height:104px; border-radius:18px; overflow:hidden; border:1px solid var(--border); background:#0b0b0d; }
  .cat.apex .art{ border-color:rgba(var(--accent-rgb),0.5); box-shadow:0 0 22px rgba(var(--accent-rgb),0.16); }
  .cat .art img{ width:100%; height:100%; object-fit:cover; display:block; }
  .cat span{ display:block; margin-top:8px; font-size:12px; color:var(--subtle); letter-spacing:0.03em; }

  .stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:22px; }
  .stat{ background:rgba(48,50,56,0.34); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:14px 8px; text-align:center; }
  .stat strong{ display:block; font-size:22px; } .stat strong.hot{ color:var(--accent); } .stat span{ font-size:11px; color:var(--subtle); }

  /* floating APEX coach */
  .fab{ position:absolute; right:18px; bottom:26px; z-index:3; width:62px; height:62px; border-radius:50%;
    overflow:hidden; border:1px solid rgba(var(--accent-rgb),0.5); box-shadow:0 0 26px rgba(var(--accent-rgb),0.25), 0 8px 20px rgba(0,0,0,0.5); background:#0b0b0d; }
  .fab img{ width:100%; height:100%; object-fit:cover; transform:scale(1.35) translateY(6%); display:block; }
</style>
</head>
<body>
  <div class="device">
    <div class="scene"></div>
    <div class="scene-dim"></div>
    <div class="screen">
      <div class="topbar pad">
        <div class="lockup">
          <div class="mark"><img src="icons/redesign/brand/ice.png"></div>
          <span class="wordmark">HomeFit</span>
        </div>
        <div class="me">B</div>
      </div>

      <div class="greet pad">
        <p class="eyebrow">Saturday · Day 6 streak</p>
        <h1>Let's work, Brent.</h1>
      </div>

      <div class="pad">
        <div class="today">
          <p class="tag">Today's session</p>
          <h2>Back &amp; Biceps</h2>
          <p class="meta">45 min · 8 exercises · ~390 kcal</p>
          <button class="btn">Start workout</button>
        </div>
      </div>

      <p class="row-label pad">Train</p>
      <div class="strip">
        <div class="cat apex"><div class="art"><img src="icons/redesign/apex/ice.png"></div><span>APEX</span></div>
        <div class="cat"><div class="art"><img src="icons/redesign/upper/ice.png"></div><span>Upper</span></div>
        <div class="cat"><div class="art"><img src="icons/redesign/core/ice.png"></div><span>Core</span></div>
        <div class="cat"><div class="art"><img src="icons/redesign/lower/ice.png"></div><span>Lower</span></div>
        <div class="cat"><div class="art"><img src="icons/redesign/rest/ice.png"></div><span>Rest</span></div>
      </div>

      <div class="stats pad">
        <div class="stat"><strong class="hot">6</strong><span>Day streak</span></div>
        <div class="stat"><strong>4 / 4</strong><span>This week</span></div>
        <div class="stat"><strong>182</strong><span>Minutes</span></div>
      </div>
    </div>
    <div class="fab"><img src="icons/redesign/apex/ice.png"></div>
  </div>
</body>
</html>
